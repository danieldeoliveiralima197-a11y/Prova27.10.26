<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crie sua Conta</title>
    <link href="./css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dork">
    <div class="contaner min-vh-100 d-flex aligm-itens-center justify-content-center">
    <div class="row w-100 justify-content-center">
        <div class="col-12 col-md-8 col-lg-5 col-xl-4">
            <div class="card-border -0 shadow-lg rounded-4">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold">Crie sua Conta</h2>
                        <p class="text-secondory">Comece seu Cadastro ja</p>
                    </div>
                    <form>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nome</label>
                            <imput type="name" class="form-control form-control-lg" placeholder="Digite seu Nome"></imput>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">E-mail</label>
                            <imput type="email" class="form-control form-control-lg" placeholder="example@email"></imput>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Senha</label>
                            <imput type="password" class="form-control form-control-lg" placeholder="Digite sua Senha"></imput>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Confirme sua Senha</label>
                            <imput type="password" class="form-control form-control-lg" placeholder="Confirme sua Senha"></imput>
                        </div>
                         <button type="submit" class="btn-primany btn-lg w-100">Cadastra</button>
                    </form>
                    <div class="text-center mb-4">
                        <p class="fw-semibold">Ja tem uma Conta</p>
                        <a href="./login.html" class="text-center">Faça seu login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>
    <script src="./js/bootstrap.bundle.min.js"></script>
</body>
</html>
